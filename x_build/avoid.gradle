import java.nio.file.Files
import java.nio.file.Path

apply from: rootProject.file("x_build/api/github_api.gradle")
apply from: rootProject.file("x_build/mod_info.gradle")

var libs = project.file("libs").toPath()

Path avoid        = project.file("libs/Avoid-${properties.avoid_version}.jar").toPath()
Path avoidSources = project.file("libs/Avoid-${properties.avoid_version}-sources.jar").toPath()

ext.libs = libs

ext.avoid        = avoid
ext.avoidSources = avoidSources

@SuppressWarnings('GrMethodMayBeStatic')
void downloadAvoid_fun() {
    Files.createDirectories(libs)

    var version = github_getRelease("AvoidLib/Avoid", properties.avoid_version)

    URI.create(version['assets'][1]['browser_download_url'] as String) \
       .toURL() \
       .withInputStream{ i -> avoid.withOutputStream{ it << i }}

    URI.create(version['assets'][0]['browser_download_url'] as String) \
       .toURL() \
       .withInputStream{ i -> avoidSources.withOutputStream{ it << i }}
}

tasks.register("downloadAvoid") {
    doFirst {
        downloadAvoid_fun()
    }
}

if (!Files.isRegularFile(avoid) || !Files.isRegularFile(avoidSources)) {
    downloadAvoid_fun()
}

/**
 * Returns the Minecraft version that the Avoid JAR hosted on GitHub is made for.
 */
String nativeAvoidMinecraft() {
    return readFMJ(avoid)['depends']['minecraft']
}

ext {
    nativeAvoidMinecraft = this.&nativeAvoidMinecraft
}
